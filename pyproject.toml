[project]
name = "physics-simulator"
version = "0.1.0"
description = "A lightweight, extensible 2D particle physics simulation engine built in Python"
readme = "README.md"
authors = [
    { name = "Siddhant Sharma", email = "sharmasiddhant@protonmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
]

[project.scripts]
physics-simulator = "physics_simulator:main"

[project.optional-dependencies]
dev = [
    "ipython>=9.16.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
notebook = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"
